# MMAR CLI adapters.
#
# Each section defines how to invoke a coding-agent CLI in headless mode.
# `argv` is a list of arguments. The driver passes the prompt via stdin
# unless `prompt_via = "argv"`, in which case it appends the prompt as a
# final positional argument. `argv-after-flag` inserts the prompt right
# after `prompt_flag` in argv (some CLIs require this).
#
# `timeout_sec` is per-invocation. `enabled = false` skips this CLI even
# if installed.
#
# Add or fix entries here when CLIs change their flags. The driver reads
# this file on every run.

# --- Default-on tier: the canonical reviewers ---

[claude]
enabled = true
binary = "claude"
argv = ["--print", "--permission-mode", "plan"]
prompt_via = "argv"
timeout_sec = 300
notes = "claude --print runs non-interactively. plan mode is read-only."

[codex]
enabled = true
binary = "codex"
argv = ["exec", "--sandbox", "read-only"]
prompt_via = "argv"
timeout_sec = 300
notes = "codex exec is the non-interactive entry. read-only sandbox prevents writes."

[gemini]
enabled = true
binary = "gemini"
argv = ["--prompt", "--approval-mode", "plan", "--output-format", "text"]
prompt_via = "argv-after-flag"
prompt_flag = "--prompt"
timeout_sec = 300
notes = "gemini -p prompt runs headless. plan mode is read-only."

[pi]
enabled = true
binary = "pi"
argv = ["--print"]
prompt_via = "argv"
timeout_sec = 300
notes = "pi from pi.dev. --print runs headless and exits."

[opencode]
enabled = true
binary = "opencode"
argv = ["run"]
prompt_via = "argv"
timeout_sec = 300
notes = "opencode run <message> is the non-interactive entry."

# --- Opt-in tier: enable these only if you have them configured ---

[amp]
enabled = false
binary = "amp"
argv = []
prompt_via = "stdin"
timeout_sec = 300
notes = "amp from Sourcegraph. Reads prompt from stdin. Set enabled=true after `amp login` and confirming AMP_API_KEY works."

[droid]
enabled = false
binary = "droid"
argv = ["exec"]
prompt_via = "argv"
timeout_sec = 300
notes = "Factory's droid. `droid exec` is read-only by default. Set enabled=true after configuring Factory credentials."
